<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUAN by Baylos - Toko Afiliasi</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>
tailwind.config={theme:{extend:{fontFamily:{display:['Space Grotesk','sans-serif'],body:['DM Sans','sans-serif']}}}}
</script>
<style>
:root{--bg:#0A0A0A;--fg:#F5F5F5;--muted:#6B6B6B;--accent:#D4A017;--accent-light:#F0C75E;--accent-dark:#8B6914;--card:#131313;--card-hover:#1A1A1A;--border:#1E1E1E;--success:#22C55E;--danger:#EF4444;--warning:#F59E0B}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.logo-text{font-family:'Space Grotesk',sans-serif;font-weight:700;background:linear-gradient(135deg,#F0C75E 0%,#D4A017 40%,#8B6914 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.15em}
.logo-sub{font-family:'DM Sans',sans-serif;font-weight:300;color:var(--muted);letter-spacing:.35em;text-transform:uppercase;font-size:.65rem}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideR{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulseGold{0%,100%{box-shadow:0 0 0 0 rgba(212,160,23,.35)}50%{box-shadow:0 0 0 12px rgba(212,160,23,0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.fade-up{animation:fadeUp .55s ease-out both}.slide-r{animation:slideR .4s ease-out both}
.pulse-gold{animation:pulseGold 2s infinite}
.shimmer{background:linear-gradient(90deg,transparent 30%,rgba(212,160,23,.08) 50%,transparent 70%);background-size:200% 100%;animation:shimmer 3s infinite}
.product-card{transition:all .3s ease;border:1px solid var(--border);border-radius:.75rem;overflow:hidden;background:var(--card)}
.product-card:hover{transform:translateY(-5px);border-color:var(--accent);box-shadow:0 12px 40px rgba(212,160,23,.08)}
.btn-gold{background:linear-gradient(135deg,#D4A017,#8B6914);color:#000;font-weight:600;padding:.65rem 1.5rem;border-radius:.5rem;border:none;cursor:pointer;transition:all .3s;font-family:'DM Sans',sans-serif;font-size:.9rem}
.btn-gold:hover{background:linear-gradient(135deg,#F0C75E,#D4A017);transform:translateY(-1px);box-shadow:0 4px 20px rgba(212,160,23,.3)}
.btn-outline{background:transparent;color:var(--accent);border:1px solid var(--accent);padding:.55rem 1.25rem;border-radius:.5rem;cursor:pointer;transition:all .3s;font-family:'DM Sans',sans-serif;font-weight:500;font-size:.85rem}
.btn-outline:hover{background:rgba(212,160,23,.1)}
.btn-sm{padding:.4rem .9rem;font-size:.8rem;border-radius:.4rem}
.btn-danger{background:rgba(239,68,68,.15);color:#EF4444;border:1px solid rgba(239,68,68,.3);padding:.4rem .9rem;border-radius:.4rem;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:500;transition:all .2s}
.btn-danger:hover{background:rgba(239,68,68,.25)}
.btn-success{background:rgba(34,197,94,.15);color:#22C55E;border:1px solid rgba(34,197,94,.3);padding:.4rem .9rem;border-radius:.4rem;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:500;transition:all .2s}
.btn-success:hover{background:rgba(34,197,94,.25)}
.input-field{background:var(--bg);border:1px solid var(--border);color:var(--fg);padding:.75rem 1rem;border-radius:.5rem;font-family:'DM Sans',sans-serif;width:100%;transition:border-color .3s;font-size:.9rem}
.input-field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(212,160,23,.1)}
.input-field::placeholder{color:#444}
.toast{position:fixed;top:1.25rem;right:1.25rem;z-index:10000;padding:.9rem 1.4rem;border-radius:.7rem;font-weight:500;animation:slideR .3s ease-out;max-width:380px;display:flex;align-items:center;gap:.7rem;font-size:.9rem}
.toast-success{background:#064E3B;color:#A7F3D0;border:1px solid #10B981}
.toast-error{background:#7F1D1D;color:#FCA5A5;border:1px solid #EF4444}
.toast-info{background:#1E3A5F;color:#93C5FD;border:1px solid #3B82F6}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:9998;display:flex;align-items:center;justify-content:center;animation:fadeUp .2s ease-out}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:1rem;padding:2rem;max-width:520px;width:92%;max-height:88vh;overflow-y:auto;animation:fadeUp .3s ease-out}
#particles-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.sidebar-item{padding:.7rem 1.4rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:.7rem;color:var(--muted);font-weight:500;border-left:3px solid transparent;font-size:.9rem}
.sidebar-item:hover{color:var(--fg);background:rgba(255,255,255,.02)}
.sidebar-item.active{color:var(--accent);border-left-color:var(--accent);background:rgba(212,160,23,.04)}
.data-table{width:100%;border-collapse:collapse}
.data-table th{text-align:left;padding:.7rem .9rem;border-bottom:1px solid var(--border);color:var(--muted);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
.data-table td{padding:.7rem .9rem;border-bottom:1px solid var(--border);font-size:.85rem}
.data-table tr:hover td{background:rgba(255,255,255,.015)}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:.75rem;padding:1.3rem;transition:all .3s}
.stat-card:hover{border-color:rgba(212,160,23,.25)}
.badge{display:inline-flex;align-items:center;padding:.2rem .65rem;border-radius:9999px;font-size:.7rem;font-weight:600}
.badge-success{background:rgba(34,197,94,.12);color:#22C55E}
.badge-warning{background:rgba(245,158,11,.12);color:#F59E0B}
.badge-danger{background:rgba(239,68,68,.12);color:#EF4444}
.badge-info{background:rgba(96,165,250,.12);color:#60A5FA}
.hero-glow{position:absolute;width:500px;height:500px;border-radius:50%;filter:blur(120px);opacity:.15;pointer-events:none}
.nav-link{color:var(--muted);font-weight:500;font-size:.9rem;transition:color .2s;cursor:pointer;padding:.4rem 0;border-bottom:2px solid transparent}
.nav-link:hover,.nav-link.active{color:var(--accent);border-bottom-color:var(--accent)}
@media(max-width:768px){.admin-sidebar-wrap{display:none}.admin-sidebar-wrap.open{display:block;position:fixed;top:64px;left:0;right:0;bottom:0;z-index:100;background:var(--card);border-top:1px solid var(--border)}}
</style>
</head>
<body>
<div id="toast-container"></div>
<div id="modal-container"></div>
<div id="app" style="position:relative;z-index:1"></div>
<canvas id="particles-canvas"></canvas>

<script>
/* ===== UTILITAS ===== */
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function formatRp(n){return'Rp '+Math.round(n).toLocaleString('id-ID')}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function genCode(name){const c=name.replace(/[^a-zA-Z]/g,'').toUpperCase().slice(0,3);const r=Math.random().toString(36).slice(2,6).toUpperCase();return c+r}

/* ===== DATABASE (localStorage) ===== */
const KEYS={users:'cuan_users',products:'cuan_products',sales:'cuan_sales'};
function getDB(k){try{return JSON.parse(localStorage.getItem(k))||null}catch{return null}}
function setDB(k,v){localStorage.setItem(k,JSON.stringify(v))}

const DEFAULT_PRODUCTS=[
{id:'p1',name:'Headphone Gaming RGB Pro',price:350000,image:'https://picsum.photos/seed/hp77/400/400',desc:'Headphone gaming dengan lampu RGB, driver 50mm, noise cancelling aktif, dan mikrofon detachable.',link:'https://shopee.co.id/sample/headphone-rgb-pro',comm:10,cat:'Audio',active:true},
{id:'p2',name:'Keyboard Mechanical TKL',price:450000,image:'https://picsum.photos/seed/kb88/400/400',desc:'Keyboard mechanical tenkeyless, switch blue hot-swappable, RGB per-key lighting, PBT keycaps.',link:'https://shopee.co.id/sample/keyboard-mech-tkl',comm:12,cat:'Keyboard',active:true},
{id:'p3',name:'Mouse Wireless Ergonomis',price:280000,image:'https://picsum.photos/seed/ms99/400/400',desc:'Mouse wireless ergonomis dengan sensor 16000 DPI, 6 tombol programmable, baterai tahan 3 bulan.',link:'https://shopee.co.id/sample/mouse-wireless-ergo',comm:8,cat:'Mouse',active:true},
{id:'p4',name:'Webcam Full HD 1080p',price:520000,image:'https://picsum.photos/seed/wc55/400/400',desc:'Webcam Full HD 1080p 30fps, auto focus, built-in mic noise reduction, clip universal.',link:'https://shopee.co.id/sample/webcam-fhd-1080p',comm:10,cat:'Aksesoris',active:true},
{id:'p5',name:'Speaker Bluetooth Portable',price:199000,image:'https://picsum.photos/seed/sp33/400/400',desc:'Speaker bluetooth 5.0 portable, bass kuat, tahan air IPX5, baterai 12 jam.',link:'https://shopee.co.id/sample/speaker-bt-portable',comm:8,cat:'Audio',active:true},
{id:'p6',name:'Ring Light 26cm + Tripod',price:175000,image:'https://picsum.photos/seed/rl44/400/400',desc:'Ring light LED 26cm 3 warna, 10 level brightness, tripod 2m, remote shutter.',link:'https://shopee.co.id/sample/ring-light-26cm',comm:10,cat:'Aksesoris',active:true},
{id:'p7',name:'USB Hub 7-Port Charging',price:150000,image:'https://picsum.photos/seed/uh22/400/400',desc:'USB hub 7 port dengan QC 3.0 charging, plug & play, kompatibel semua device.',link:'https://shopee.co.id/sample/usb-hub-7port',comm:7,cat:'Aksesoris',active:true},
{id:'p8',name:'Mousepad XL Premium Desk',price:125000,image:'https://picsum.photos/seed/mp11/400/400',desc:'Mousepad desk mat XXL 80x30cm, kain microfiber halus, anti-slip rubber base.',link:'https://shopee.co.id/sample/mousepad-xl-desk',comm:10,cat:'Mouse',active:true}
];

function initDB(){
if(!getDB(KEYS.users)){
const admin={id:'adm-001',name:'Baylos',email:'admin@cuan.id',password:'admin123',role:'admin',balance:0,code:'BAYLOS',refBy:null,createdAt:new Date().toISOString()};
setDB(KEYS.users,[admin]);
}
if(!getDB(KEYS.products))setDB(KEYS.products,DEFAULT_PRODUCTS);
if(!getDB(KEYS.sales))setDB(KEYS.sales,[]);
}

/* ===== STATE ===== */
let currentUser=null;
let currentView='home';
let referralCode=null;
let adminTab='overview';
let userTab='overview';
let mobileMenuOpen=false;
let adminSidebarOpen=false;

/* ===== TOAST ===== */
function toast(msg,type='info'){
const c=document.getElementById('toast-container');
const el=document.createElement('div');
el.className='toast toast-'+type;
const icons={success:'fa-check-circle',error:'fa-times-circle',info:'fa-info-circle'};
el.innerHTML=`<i class="fas ${icons[type]||icons.info}"></i><span>${msg}</span>`;
c.appendChild(el);
setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(20px)';el.style.transition='all .3s';setTimeout(()=>el.remove(),300)},3000);
}

/* ===== MODAL ===== */
function showModal(html){
document.getElementById('modal-container').innerHTML=`<div class="modal-overlay" data-action="close-modal"><div class="modal-box" onclick="event.stopPropagation()">${html}</div></div>`;
}
function closeModal(){document.getElementById('modal-container').innerHTML=''}

/* ===== AUTH ===== */
function doLogin(email,pw){
const users=getDB(KEYS.users);
const u=users.find(x=>x.email===email&&x.password===pw);
if(!u){toast('Email atau password salah','error');return false}
currentUser=u;sessionStorage.setItem('cuan_session',u.id);
toast('Selamat datang, '+esc(u.name)+'!','success');return true;
}
function doRegister(name,email,pw){
const users=getDB(KEYS.users);
if(users.find(x=>x.email===email)){toast('Email sudah terdaftar','error');return false}
if(pw.length<6){toast('Password minimal 6 karakter','error');return false}
const u={id:'u-'+genId(),name,email,password:pw,role:'user',balance:0,code:genCode(name),refBy:referralCode,createdAt:new Date().toISOString()};
users.push(u);setDB(KEYS.users,users);
currentUser=u;sessionStorage.setItem('cuan_session',u.id);
toast('Registrasi berhasil! Kode afiliasi Anda: '+u.code,'success');return true;
}
function doLogout(){currentUser=null;sessionStorage.removeItem('cuan_session');referralCode=null;currentView='home';toast('Berhasil keluar','info');renderApp()}
function restoreSession(){const sid=sessionStorage.getItem('cuan_session');if(!sid)return;const users=getDB(KEYS.users);currentUser=users.find(x=>x.id===sid)||null}

/* ===== NAVIGASI ===== */
function nav(view){currentView=view;mobileMenuOpen=false;adminSidebarOpen=false;renderApp();window.scrollTo({top:0,behavior:'smooth'})}

/* ===== RENDER UTAMA ===== */
function renderApp(){
const app=document.getElementById('app');
let html='';
if(currentView==='admin'&&currentUser&&currentUser.role==='admin'){html=renderAdminPage()}
else{html=renderNav()+renderMainView()+renderFooter()}
app.innerHTML=html;
}

/* ===== NAVIGASI BAR ===== */
function renderNav(){
const isLogged=!!currentUser;
const isAdmin=isLogged&&currentUser.role==='admin';
let authBtns='';
if(!isLogged)authBtns=`<button data-action="nav-login" class="btn-outline btn-sm">Masuk</button><button data-action="nav-register" class="btn-gold btn-sm" style="margin-left:.5rem">Daftar</button>`;
else authBtns=`<span class="text-sm" style="color:var(--muted)">Halo, <strong style="color:var(--accent)">${esc(currentUser.name)}</strong></span>
 ${isAdmin?'<button data-action="nav-admin" class="btn-outline btn-sm" style="margin-left:.75rem"><i class="fas fa-cog mr-1"></i>Admin</button>':'<button data-action="nav-dashboard" class="btn-outline btn-sm" style="margin-left:.75rem"><i class="fas fa-wallet mr-1"></i>Dashboard</button>'}
<button data-action="nav-logout" class="btn-danger btn-sm" style="margin-left:.5rem"><i class="fas fa-sign-out-alt"></i></button>`;

return`<nav style="background:rgba(10,10,10,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:500">
<div style="max-width:1200px;margin:0 auto;padding:.75rem 1.25rem;display:flex;align-items:center;justify-content:space-between">
<div style="display:flex;align-items:center;gap:.5rem;cursor:pointer" data-action="nav-home">
<div style="width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#D4A017,#8B6914);display:flex;align-items:center;justify-content:center;font-weight:800;color:#000;font-family:'Space Grotesk';font-size:1rem">C</div>
<div><div class="logo-text" style="font-size:1.2rem;line-height:1.1">CUAN</div><div class="logo-sub">by baylos</div></div>
</div>
<div style="display:flex;align-items:center;gap:1.25rem" class="hidden md:flex">
<a class="nav-link ${currentView==='home'?'active':''}" data-action="nav-home">Beranda</a>
<a class="nav-link" data-action="scroll-products">Produk</a>
<a class="nav-link" data-action="scroll-how">Cara Kerja</a>
</div>
<div style="display:flex;align-items:center;gap:.5rem">${authBtns}<button data-action="toggle-mobile" class="md:hidden" style="background:none;border:none;color:var(--fg);font-size:1.3rem;cursor:pointer;padding:.25rem"><i class="fas fa-bars"></i></button></div>
</div>
 ${mobileMenuOpen?`<div style="padding:.5rem 1.25rem 1rem;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:.5rem" class="md:hidden">
<a class="nav-link" data-action="nav-home">Beranda</a><a class="nav-link" data-action="scroll-products">Produk</a><a class="nav-link" data-action="scroll-how">Cara Kerja</a>
</div>`:''}
</nav>`;
}

/* ===== RENDER VIEW UTAMA ===== */
function renderMainView(){
if(currentView==='login')return renderLogin();
if(currentView==='register')return renderRegister();
if(currentView==='dashboard'&&currentUser)return renderUserDash();
return renderHome();
}

/* ===== HALAMAN BERANDA ===== */
function renderHome(){
const products=getDB(KEYS.products).filter(p=>p.active);
let prodCards=products.map((p,i)=>`
<div class="product-card fade-up" style="animation-delay:${i*.07}s">
<div style="position:relative;overflow:hidden"><img src="${esc(p.image)}" alt="${esc(p.name)}" style="width:100%;height:220px;object-fit:cover;transition:transform .4s" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
<div style="position:absolute;top:.75rem;right:.75rem"><span class="badge badge-success"><i class="fas fa-coins mr-1"></i>Komisi ${p.comm}%</span></div>
</div>
<div style="padding:1.1rem">
<h3 style="font-family:'Space Grotesk';font-weight:600;font-size:1rem;margin-bottom:.4rem;line-height:1.3">${esc(p.name)}</h3>
<p style="color:var(--muted);font-size:.8rem;line-height:1.5;margin-bottom:.75rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(p.desc)}</p>
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem">
<span style="font-family:'Space Grotesk';font-weight:700;font-size:1.1rem;color:var(--accent)">${formatRp(p.price)}</span>
<span style="color:var(--success);font-size:.8rem;font-weight:500">+${formatRp(p.price*p.comm/100)}</span>
</div>
<button data-action="buy-product" data-id="${p.id}" class="btn-gold" style="width:100%;font-size:.85rem;padding:.6rem"><i class="fas fa-shopping-cart mr-2"></i>Beli Sekarang</button>
</div>
</div>`).join('');

return`
<!-- HERO -->
<section style="position:relative;min-height:85vh;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:2rem 1.25rem">
<div class="hero-glow" style="background:var(--accent);top:-100px;left:-100px"></div>
<div class="hero-glow" style="background:#8B6914;bottom:-100px;right:-100px"></div>
<div style="text-align:center;max-width:700px;position:relative;z-index:2">
<div class="fade-up">
<div style="display:inline-flex;align-items:center;gap:.5rem;padding:.4rem 1rem;border-radius:9999px;border:1px solid var(--border);margin-bottom:2rem;font-size:.8rem;color:var(--muted)">
<i class="fas fa-bolt" style="color:var(--accent)"></i> Platform Afiliasi Terpercaya
</div>
</div>
<div class="fade-up" style="animation-delay:.1s">
<div style="font-family:'Space Grotesk';font-weight:700;font-size:clamp(3rem,10vw,6rem);line-height:1;background:linear-gradient(135deg,#F0C75E 0%,#D4A017 35%,#8B6914 70%,#D4A017 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.12em;margin-bottom:.5rem">CUAN</div>
<div class="logo-sub" style="font-size:.85rem;letter-spacing:.5em;margin-bottom:2rem">by baylos</div>
</div>
<p class="fade-up" style="animation-delay:.2s;color:var(--muted);font-size:1.1rem;line-height:1.7;max-width:520px;margin:0 auto 2.5rem">Dapatkan penghasilan dari setiap penjualan yang Anda referensikan. Daftar gratis, bagikan link, dan raih komisi tanpa batas.</p>
<div class="fade-up" style="animation-delay:.3s;display:flex;gap:1rem;justify-content:center;flex-wrap:wrap">
<button data-action="nav-register" class="btn-gold pulse-gold" style="padding:.8rem 2rem;font-size:1rem"><i class="fas fa-rocket mr-2"></i>Mulai Sekarang</button>
<button data-action="scroll-products" class="btn-outline" style="padding:.8rem 2rem;font-size:1rem"><i class="fas fa-eye mr-2"></i>Lihat Produk</button>
</div>
<div class="fade-up" style="animation-delay:.45s;display:flex;gap:2.5rem;justify-content:center;margin-top:3.5rem">
<div style="text-align:center"><div style="font-family:'Space Grotesk';font-weight:700;font-size:1.6rem;color:var(--accent)">8+</div><div style="color:var(--muted);font-size:.75rem;margin-top:.2rem">Produk</div></div>
<div style="text-align:center"><div style="font-family:'Space Grotesk';font-weight:700;font-size:1.6rem;color:var(--accent)">10%</div><div style="color:var(--muted);font-size:.75rem;margin-top:.2rem">Komisi</div></div>
<div style="text-align:center"><div style="font-family:'Space Grotesk';font-weight:700;font-size:1.6rem;color:var(--accent)">Gratis</div><div style="color:var(--muted);font-size:.75rem;margin-top:.2rem">Daftar</div></div>
</div>
</div>
</section>

<!-- PRODUK -->
<section id="section-products" style="max-width:1200px;margin:0 auto;padding:4rem 1.25rem">
<div style="text-align:center;margin-bottom:3rem">
<span class="badge badge-info" style="margin-bottom:1rem;display:inline-flex"><i class="fas fa-fire mr-1"></i>Produk Terpilih</span>
<h2 style="font-family:'Space Grotesk';font-weight:700;font-size:2rem;margin-top:.75rem">Katalog Produk</h2>
<p style="color:var(--muted);margin-top:.5rem;max-width:480px;margin-left:auto;margin-right:auto">Pilih produk, bagikan link afiliasi Anda, dan dapatkan komisi dari setiap penjualan berhasil.</p>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.25rem">${prodCards}</div>
</section>

<!-- CARA KERJA -->
<section id="section-how" style="max-width:1000px;margin:0 auto;padding:4rem 1.25rem">
<div style="text-align:center;margin-bottom:3rem">
<span class="badge badge-warning" style="margin-bottom:1rem;display:inline-flex"><i class="fas fa-lightbulb mr-1"></i>Mudah & Cepat</span>

/* ===== LOGIC: BELI PRODUK ===== */
function handleBuy(productId){
const products=getDB(KEYS.products);
const product=products.find(p=>p.id===productId);
if(!product)return;
/* Jika ada referral code, catat sebagai penjualan pending */
if(referralCode){
const users=getDB(KEYS.users);
const affUser=users.find(u=>u.code===referralCode&&u.role!=='admin');
if(affUser){
const sales=getDB(KEYS.sales);
const commAmt=Math.round(product.price*product.comm/100);
sales.push({id:'s-'+genId(),productId,affUserId:affUser.id,commAmt,status:'pending',date:new Date().toISOString()});
setDB(KEYS.sales,sales);
toast('Link afiliasi terdeteksi! Penjualan dicatat sebagai pending.','info');
}
}
/* Buka link afiliasi */
window.open(product.link,'_blank');
}

/* ===== EVENT DELEGATION ===== */
document.getElementById('app').addEventListener('click',function(e){
const t=e.target.closest('[data-action]');
if(!t)return;
const action=t.dataset.action;
const id=t.dataset.id;
const tab=t.dataset.tab;

switch(action){
case 'nav-home':nav('home');break;
case 'nav-login':nav('login');break;
case 'nav-register':nav('register');break;
case 'nav-dashboard':nav('dashboard');break;
case 'nav-admin':nav('admin');break;
case 'nav-logout':doLogout();break;
case 'toggle-mobile':mobileMenuOpen=!mobileMenuOpen;renderApp();break;
case 'toggle-admin-sidebar':adminSidebarOpen=!adminSidebarOpen;renderApp();break;
case 'scroll-products':if(currentView==='home'){document.getElementById('section-products')?.scrollIntoView({behavior:'smooth'})}else{nav('home');setTimeout(()=>document.getElementById('section-products')?.scrollIntoView({behavior:'smooth'}),100)}break;
case 'scroll-how':if(currentView==='home'){document.getElementById('section-how')?.scrollIntoView({behavior:'smooth'})}else{nav('home');setTimeout(()=>document.getElementById('section-how')?.scrollIntoView({behavior:'smooth'}),100)}break;
case 'user-tab':userTab=tab;renderApp();break;
case 'admin-tab':adminTab=tab;adminSidebarOpen=false;renderApp();break;
case 'buy-product':handleBuy(id);break;
case 'copy-aff-link':{const inp=document.getElementById('aff-link-input');if(inp){navigator.clipboard.writeText(inp.value).then(()=>toast('Link afiliasi berhasil disalin!','success')).catch(()=>{inp.select();document.execCommand('copy');toast('Link afiliasi berhasil disalin!','success')})}break}
case 'admin-add-product':showProductModal(null);break;
case 'admin-edit-product':{const p=getDB(KEYS.products).find(x=>x.id===id);if(p)showProductModal(p);break}
case 'admin-del-product':{
const prods=getDB(KEYS.products).filter(x=>x.id!==id);setDB(KEYS.products,prods);toast('Produk berhasil dihapus','success');renderApp();break}
case 'approve-sale':{const sales=getDB(KEYS.sales);const s=sales.find(x=>x.id===id);if(s){s.status='approved';setDB(KEYS.sales,sales);toast('Penjualan disetujui! Komisi dikreditkan.','success');renderApp()}break}
case 'reject-sale':{const sales=getDB(KEYS.sales).filter(x=>x.id!==id);setDB(KEYS.sales,sales);toast('Penjualan ditolak.','error');renderApp();break}
case 'admin-add-sale':showManualSaleModal();break;
case 'close-modal':closeModal();break;
}
});

/* FORM SUBMISSIONS */
document.getElementById('app').addEventListener('submit',function(e){
const form=e.target.closest('[data-action]');
if(!form)return;
e.preventDefault();
const action=form.dataset.action;

if(action==='submit-login'){
const email=document.getElementById('login-email').value.trim();
const pw=document.getElementById('login-pass').value;
if(doLogin(email,pw)){if(currentUser.role==='admin')nav('admin');else nav('dashboard')}
}
else if(action==='submit-register'){
const name=document.getElementById('reg-name').value.trim();
const email=document.getElementById('reg-email').value.trim();
const pw=document.getElementById('reg-pass').value;
if(doRegister(name,email,pw))nav('dashboard');
}
else if(action==='admin-save-new-product'){
const fd=new FormData(form);
const products=getDB(KEYS.products);
products.push({id:'p-'+genId(),name:fd.get('name'),price:Number(fd.get('price')),image:fd.get('image'),desc:fd.get('desc'),link:fd.get('link'),comm:Number(fd.get('comm')),cat:'Lainnya',active:!!fd.get('active')});
setDB(KEYS.products,products);closeModal();toast('Produk berhasil ditambahkan!','success');renderApp();
}
else if(action==='admin-save-edit-product'){
const fd=new FormData(form);const pid=form.dataset.id;
const products=getDB(KEYS.products);const p=products.find(x=>x.id===pid);
if(p){p.name=fd.get('name');p.price=Number(fd.get('price'));p.image=fd.get('image');p.desc=fd.get('desc');p.link=fd.get('link');p.comm=Number(fd.get('comm'));p.active=!!fd.get('active');setDB(KEYS.products,products);closeModal();toast('Produk berhasil diperbarui!','success');renderApp()}
}
else if(action==='admin-save-manual-sale'){
const fd=new FormData(form);const pid=fd.get('productId');const uid=fd.get('affUserId');
if(!pid||!uid){toast('Pilih produk dan user afiliasi','error');return}
const products=getDB(KEYS.products);const product=products.find(x=>x.id===pid);
if(!product){toast('Produk tidak ditemukan','error');return}
const sales=getDB(KEYS.sales);
const commAmt=Math.round(product.price*product.comm/100);
sales.push({id:'s-'+genId(),productId:pid,affUserId:uid,commAmt,status:'approved',date:new Date().toISOString()});
setDB(KEYS.sales,sales);closeModal();toast('Penjualan dicatat dan komisi dikreditkan!','success');renderApp();
}
});

document.getElementById('modal-container').addEventListener('click',function(e){

});

/* ===== PARTIKEL EMAS ===== */
function initParticles(){
const canvas=document.getElementById('particles-canvas');
const ctx=canvas.getContext('2d');
let w,h;const particles=[];const COUNT=50;
function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight}
resize();window.addEventListener('resize',resize);
for(let i=0;i<COUNT;i++){particles.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2+.5,dx:(Math.random()-.5)*.3,dy:(Math.random()-.5)*.3,o:Math.random()*.4+.1})}
function draw(){
ctx.clearRect(0,0,w,h);
for(const p of particles){
p.x+=p.dx;p.y+=p.dy;
if(p.x<0)p.x=w;if(p.x>w)p.x=0;if(p.y<0)p.y=h;if(p.y>h)p.y=0;
ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.5,p.r),0,Math.PI*2);
ctx.fillStyle=`rgba(212,160,23,${p.o})`;ctx.fill();
}
/* Garis koneksi */
for(let i=0;i<particles.length;i++){for(let j=i+1;j<particles.length;j++){
const dx=particles[i].x-particles[j].x;const dy=particles[i].y-particles[j].y;
const dist=Math.sqrt(dx*dx+dy*dy);
if(dist<150){ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);
ctx.strokeStyle=`rgba(212,160,23,${.06*(1-dist/150)})`;ctx.stroke()}
}}
requestAnimationFrame(draw);
}
/* Respek prefers-reduced-motion */
if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches)draw();
}

/* ===== INISIALISASI ===== */
function init(){
initDB();
/* Cek referral code dari URL */
const params=new URLSearchParams(window.location.search);
if(params.get('ref')){referralCode=params.get('ref').toUpperCase();sessionStorage.setItem('cuan_ref',referralCode)}
else{referralCode=sessionStorage.getItem('cuan_ref')||null}
/* Restore session */
restoreSession();
/* Redirect admin langsung ke admin panel */
if(currentUser&&currentUser.role==='admin')currentView='admin';
else if(currentUser)currentView='dashboard';
/* Render */
renderApp();
initParticles();
}
init();
