<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Affiliate & Komisi Penjualan</title>
    <!-- Tailwind CSS CDN untuk Tampilan Modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- Header / Navbar -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-wallet"></i> System Affiliate & Komisi
            </h1>
            <div id="userInfo" class="text-sm font-medium bg-indigo-700 px-3 py-1 rounded-full hidden">
                <i class="fa-solid fa-user-check"></i> <span id="navNama">User</span>
            </div>
        </div>
    </header>

    <!-- Content Container -->
    <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <!-- FORM 1: Registrasi User & Rekening -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-800 mb-4 pb-2 border-b flex items-center gap-2">
                <i class="fa-solid fa-id-card text-indigo-600"></i> 1. Data User & Bank
            </h2>
            <form id="userForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Nama Lengkap</label>
                    <input type="text" id="nama" placeholder="Contoh: Ahmad Subagja" required
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Alamat Email</label>
                    <input type="email" id="email" placeholder="ahmad@example.com" required
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Nomor WhatsApp / Telepon</label>
                    <input type="tel" id="telepon" placeholder="081234567890" pattern="[0-9]{10,13}" required
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <p class="text-xs text-slate-400 mt-1">Format angka 10-13 digit</p>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Nomor Rekening Bank</label>
                    <input type="text" id="rekening" placeholder="1234567890 (BCA/Mandiri/BRI)" pattern="[0-9]{8,18}" required
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <p class="text-xs text-slate-400 mt-1">Format angka 8-18 digit</p>
                </div>

                <button type="submit" id="btnSimpan" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow flex justify-center items-center gap-2">
                    <i class="fa-solid fa-save"></i> Simpan & Aktivasi Akun
                </button>
            </form>
        </section>

        <!-- DASHBOARD & SIMULASI TRANSAKSI -->
        <section class="space-y-6">
            
            <!-- Dashboard Saldo Komisi -->
            <div class="bg-gradient-to-r from-emerald-500 to-teal-600 text-white p-6 rounded-xl shadow-md">
                <span class="text-sm font-medium opacity-90">Total Komisi Masuk (Barang Selesai)</span>
                <h3 id="saldoKomisi" class="text-3xl font-extrabold mt-1">Rp 0</h3>
                <p class="text-xs mt-2 opacity-80">*Komisi 10% dari tiap transaksi sukses</p>
            </div>

            <!-- FORM 2: Simulasi Transaksi -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-slate-800 mb-4 pb-2 border-b flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping text-indigo-600"></i> 2. Simulasi Transaksi & Komisi
                </h2>

                <form id="transaksiForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">Sumber Pembelian</label>
                        <select id="sumberPembelian" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                            <option value="link_share">Via Link Affiliate (Dishare User)</option>
                            <option value="langsung">Pembelian Langsung di Platform</option>
                            <option value="tanpa_ref">Pembelian Tanpa Referal (Tidak Ada Komisi)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold mb-1">Status Pengiriman Barang</label>
                        <select id="statusBarang" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                            <option value="proses">Sedang Diproses / Dalam Pengiriman</option>
                            <option value="diterima">Barang Sudah Diterima Pembeli (Selesai)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold mb-1">Harga Barang (Rp)</label>
                        <input type="number" id="harga" value="150000" min="10000" step="5000" required
                            class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>

                    <button type="submit" 
                        class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow flex justify-center items-center gap-2">
                        <i class="fa-solid fa-play"></i> Jalankan Simulasi Transaksi
                    </button>
                </form>
            </div>

            <!-- Riwayat Transaksi -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h3 class="text-md font-bold text-slate-800 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-indigo-600"></i> Riwayat Komisi
                </h3>
                <div class="max-h-48 overflow-y-auto pr-1">
                    <ul id="logList" class="space-y-2 text-sm">
                        <li class="text-slate-400 text-center py-4 italic" id="emptyLog">Belum ada simulasi transaksi.</li>
                    </ul>
                </div>
            </div>

        </section>
    </main>

    <!-- JavaScript Logika Sistem -->
    <script>
        let isUserValid = false;
        let totalKomisi = 0;
        const persentaseKomisi = 0.10; // 10%

        // 1. Simpan dan Validasi Data User
        document.getElementById('userForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const nama = document.getElementById('nama').value.trim();
            const email = document.getElementById('email').value.trim();
            const telepon = document.getElementById('telepon').value.trim();
            const rekening = document.getElementById('rekening').value.trim();

            if (nama.length < 3) {
                alert("Nama terlalu pendek! Harap isi nama lengkap.");
                return;
            }

            isUserValid = true;

            // UI Feedback
            document.getElementById('navNama').innerText = nama;
            document.getElementById('userInfo').classList.remove('hidden');
            
            alert(`✅ Akun Berhasil Diaktivasi!\n\nNama: ${nama}\nEmail: ${email}\nWA: ${telepon}\nRekening: ${rekening}`);
        });

        // 2. Logika Aturan Masuknya Komisi
        document.getElementById('transaksiForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Syarat Utama: User harus daftar dulu
            if (!isUserValid) {
                alert("❌ Akses Ditolak!\nHarap lengkapi dan simpan Data User & Bank di sebelah kiri terlebih dahulu.");
                return;
            }

            const sumber = document.getElementById('sumberPembelian').value;
            const status = document.getElementById('statusBarang').value;
            const harga = parseFloat(document.getElementById('harga').value);
            const logList = document.getElementById('logList');
            const emptyLog = document.getElementById('emptyLog');

            if (emptyLog) emptyLog.remove();

            // ATURAN SYARAT KOMISI:
            // 1. Pembelian dari Link Affiliate ATAU Langsung Platform (ada referal)
            // 2. Status barang SUDAH DITERIMA
            const isLinkValid = (sumber === 'link_share' || sumber === 'langsung');
            const isBarangDiterima = (status === 'diterima');

            const li = document.createElement('li');
            li.className = 'p-3 rounded-lg border text-xs flex justify-between items-start gap-2';

            if (isLinkValid && isBarangDiterima) {
                // Komisi Cair
                const komisiDapat = harga * persentaseKomisi;
                totalKomisi += komisiDapat;

                // Update saldo di UI
                document.getElementById('saldoKomisi').innerText = `Rp ${totalKomisi.toLocaleString('id-ID')}`;

                li.className += ' bg-emerald-50 border-emerald-200 text-emerald-900';
                li.innerHTML = `
                    <div>
                        <span class="font-bold text-emerald-700">SUKSES (Komisi Cair)</span>
                        <p class="mt-0.5">Nilai Transaksi: Rp ${harga.toLocaleString('id-ID')} | Sumber: ${sumber === 'link_share' ? 'Link Share' : 'Platform'}</p>
                    </div>
                    <span class="font-bold text-emerald-600 bg-emerald-100 px-2 py-1 rounded text-xs">+Rp ${komisiDapat.toLocaleString('id-ID')}</span>
                `;
            } else {
                // Komisi Tertahan / Gagal
                let pesanAlasan = "";
                if (!isLinkValid) {
                    pesanAlasan = "Tanpa referal valid";
                } else if (!isBarangDiterima) {
                    pesanAlasan = "Barang masih diproses/dikirim";
                }

                li.className += ' bg-amber-50 border-amber-200 text-amber-900';
                li.innerHTML = `
                    <div>
                        <span class="font-bold text-amber-700">PENDING / TERTANAH</span>
                        <p class="mt-0.5">Alasan: ${pesanAlasan}</p>
                    </div>
                    <span class="font-bold text-amber-600 bg-amber-100 px-2 py-1 rounded text-xs">+Rp 0</span>
                `;
            }

            logList.prepend(li);
        });
    </script>
</body>
</html>
